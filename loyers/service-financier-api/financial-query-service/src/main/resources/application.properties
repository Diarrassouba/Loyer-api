# ===================================================================
# 1. IDENTIFICATION DU SERVICE
# ===================================================================
spring.application.name=financial-query-service
server.port=8186

# ===================================================================
# 2. BASE DE DONNÉES (MongoDB)
# ===================================================================
# Configuration de connexion à votre instance MongoDB (locale par défaut)
# Spring Data MongoDB utilisera cette URI pour stocker vos projections (ex: la collection "syntheseFinanciere")
spring.data.mongodb.uri=mongodb://ddrissa:dddd@localhost:27017/financial_query_db

# ===================================================================
# 3. CONNEXION À AXON SERVER (Partage des événements)
# ===================================================================
axon.axonserver.enabled=true
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default
axon.axonserver.component-name=${spring.application.name}

# ===================================================================
# 4. SÉRIALISATION (JSON - Jackson)
# ===================================================================
# Crucial pour l'interopérabilité et très naturel avec MongoDB
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.serializer.general=jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# 5. CONFIGURATION DE L'EXTENSION AXON MONGO (Pour les Tokens)
# ===================================================================
# Cette extension fournit les implémentations nécessaires pour remplacer JPA.
# Elle va créer automatiquement des collections MongoDB pour gérer l'infrastructure Axon

# Activer le TokenStore basé sur Mongo (essentiel pour les Tracking Processors)
#.mongo.token-store.enabled=true
# (Optionnel) Nom de la collection MongoDB qui stockera les tokens (par défaut: trackingtokens)
 axon.mongo.token-store.collection-name=axon_tracking_tokens

# Activer le SagaStore basé sur Mongo (Uniquement si ce service héberge des Sagas)
# Comme c'est le query-service, il n'a normalement pas de Sagas, donc on le désactive.
axon.mongo.saga-store.enabled=false

# Activer le EventStorageEngine basé sur Mongo (Uniquement si vous N'UTILISEZ PAS Axon Server)
# Puisque nous utilisons Axon Server comme Event Store, on s'assure que ceci est désactivé.
axon.mongo.event-store.enabled=false

# ===================================================================
# 6. CONFIGURATION DES PROCESSEURS D'ÉVÉNEMENTS (Mode Tracking)
# ===================================================================
# On configure le TrackingEventProcessor de la même manière qu'avec JPA.
# Axon utilisera maintenant automatiquement le MongoTokenStore configuré ci-dessus.

# Remplacez "finance-projections" par le nom défini dans vos @ProcessingGroup
axon.eventhandling.processors.finance-projections.source=axonServerEventStore
axon.eventhandling.processors.finance-projections.mode=tracking

# ===================================================================
# CONFIGURATION SWAGGER (OpenAPI) POUR LA DOCUMENTATION DES API REST
# ===================================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

