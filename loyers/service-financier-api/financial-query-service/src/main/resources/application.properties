# ===================================================================
# 1. IDENTIFICATION DU SERVICE
# ===================================================================
spring.application.name=financial-query-service
server.port=8186
#Activer les threads virtuels pour une meilleure performance avec Axon Server
spring.threads.virtual.enabled=true

# ===================================================================
# 2. BASE DE DONNÉES (MongoDB)
# ===================================================================
# Configuration de connexion à votre instance MongoDB (locale par défaut)
# Spring Data MongoDB utilisera cette URI pour stocker vos projections (ex: la collection "syntheseFinanciere")
spring.data.mongodb.uri=mongodb://ddrissa:dddd@localhost:27017/financial_query_db?authSource=admin

# ===================================================================
# 3. CONNEXION À AXON SERVER (Partage des événements)
# ===================================================================
axon.axonserver.enabled=true
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default
axon.axonserver.component-name=${spring.application.name}

# ===================================================================
# 4. SÉRIALISATION (JSON - Jackson)
# ===================================================================
# Crucial pour l'interopérabilité et très naturel avec MongoDB
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.serializer.general=jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===================================================================
# 5. EXTENSION AXON MONGO (Pour l'infrastructure Axon)
# ===================================================================
# Ces propriétés disent à Axon d'utiliser MongoDB au lieu d'une base 
# relationnelle (JPA) pour ses propres besoins internes.

# Active le stockage des "Tracking Tokens" (la position de lecture) dans MongoDB.
# C'EST VITAL pour que le mode "tracking" fonctionne.
axon.mongo.token-store.enabled=true

# (Optionnel) Nom de la collection MongoDB qui stockera les tokens.
# Par défaut c'est "trackingtokens". On peut le préciser pour plus de clarté.
axon.mongo.token-store.collection-name=axon_tracking_tokens

# Ce service ne gère pas de Sagas (elles sont dans le command-service).
# On désactive donc le SagaStore pour ne pas créer de collection inutile.
axon.mongo.saga-store.enabled=false

# L'Event Store reste Axon Server, donc on désactive l'EventStorageEngine Mongo.
axon.mongo.event-store.enabled=false

# ===================================================================
# 6. CONFIGURATION DES PROCESSEURS D'ÉVÉNEMENTS (Mode Tracking)
# ===================================================================
# On configure le TrackingEventProcessor de la même manière qu'avec JPA.
# Axon utilisera maintenant automatiquement le MongoTokenStore configuré ci-dessus.

# --- GROUPE 1 : PROJECTIONS FINANCIÈRES (Le cœur métier) ---
# Correspond aux classes annotées avec @ProcessingGroup("query-finance-projections")
# (ex: FinanceProjection)
#axon.eventhandling.processors.query-finance-projections.source=axonServerEventStore
axon.eventhandling.processors.query-finance-projections.mode=tracking
axon.eventhandling.processors.query-finance-projections.initial-segment-count=2
axon.eventhandling.processors.query-finance-projections.thread-count=2

# --- GROUPE 2 : DONNÉES DE RÉFÉRENCE (Le cache local) ---
# Correspond à la classe annotée avec @ProcessingGroup("query-finance-reference-data")
# (ex: ReferenceDataProjection)
#axon.eventhandling.processors.query-finance-reference-data.source=axonServerEventStore
axon.eventhandling.processors.query-finance-reference-data.mode=tracking
# Pas besoin d'optimisation poussée (segments/threads multiples) pour ce groupe, 
# car la création de locataires/biens est un événement rare par rapport aux paiements.

# ===================================================================
# CONFIGURATION SWAGGER (OpenAPI) POUR LA DOCUMENTATION DES API REST
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs



