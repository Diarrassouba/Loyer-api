# ===================================================================
# APPLICATION SPRING BOOT : financial-service
# ===================================================================
spring.application.name=financial-command-service
server.port=8185

# ===================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (JPA/JDBC)
# ===================================================================
# Requis par Axon pour stocker les jetons des processeurs d'événements (Tracking Tokens)
# et l'état des Sagas (Saga Store).

# Configuration de la base de données PostgreSQL pour Financialdb
spring.datasource.url=jdbc:postgresql://localhost:5432/finacialdb?sslmode=disable
# spring.datasource.username=ddrissa
# spring.datasource.password=dddd 
spring.datasource.username=ddrissa
spring.datasource.password=dddd
spring.jpa.hibernate.ddl-auto=update

# Configuration de JPA/Hibernate
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.show-sql=true
# Dialecte pour PostgreSQL (bien que souvent détecté automatiquement par Spring Boot 3+)
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURATION AXON FRAMEWORK 4.13.0
# ===================================================================
# Active l'auto-configuration pour Axon Server (recommandé)
axon.axonserver.enabled=true

# Adresse et port de votre instance Axon Server.
# Par défaut, Axon Server tourne sur localhost:8124. Changez si votre Axon Server est ailleurs.
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default
axon.axonserver.component-name=${spring.application.name}

# --- Sérialisation JSON ---
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.serializer.general=jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# CONFIGURATION DES PROCESSEURS D'ÉVÉNEMENTS (Mode Tracking)
# ===================================================================
# 1. Groupe pour la Saga
# Le nom du groupe par défaut pour une saga est le nom simple de la classe.
axon.eventhandling.processors.SoldeContratSaga.source=axonServerEventStore
axon.eventhandling.processors.SoldeContratSaga.mode=tracking
# Note : Pour les Sagas, un segment-count > 1 nécessite une configuration avancée
# de la séquence des événements, donc on laisse à 1 par défaut.

# 2. Groupe pour le Listener d'initialisation (si package : com.example.financialservice.listener)

#axon.eventhandling.processors.com.example.financialservice.listener.source=axonServerEventStore
#axon.eventhandling.processors.com.example.financialservice.listener.mode=tracking

# 3. Groupe pour les Projections (si package : com.example.financialservice.projection)

#axon.eventhandling.processors.com.example.financialservice.projection.source=axonServerEventStore
#axon.eventhandling.processors.com.example.financialservice.projection.mode=tracking
#axon.eventhandling.processors.com.example.financialservice.projection.initial-segment-count=2
#axon.eventhandling.processors.com.example.financialservice.projection.thread-count=2

# ===================================================================
# CONFIGURATION DE L'EVENT SOURCING POUR L'AGRÉGAT
# ===================================================================
# Activer le Snapshotting pour optimiser le chargement de l'agrégat
# 'compte-financier-contrat' est le nom généré par défaut à partir du nom de la classe CompteFinancierContratAggregate
#axon.aggregate.compte-financier-contrat.snapshot-trigger=event-count
#axon.aggregate.compte-financier-contrat.snapshot-trigger-threshold=50






# ===================================================================
# CONFIGURATION SWAGGER / OPENAPI (springdoc-openapi)
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


