spring.application.name=financial-command-service
server.port=8185

# ===================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (JPA/JDBC)
# ===================================================================
# Requis par Axon pour stocker les jetons des processeurs d'événements (Tracking Tokens)
# et l'état des Sagas (Saga Store).

# Configuration de la base de données PostgreSQL pour Financialdb
spring.datasource.url=jdbc:postgresql://localhost:5432/finacialdb_axon_storage?sslmode=disable
spring.datasource.username=ddrissa
spring.datasource.password=dddd 
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dialecte pour PostgreSQL (bien que souvent détecté automatiquement par Spring Boot 3+)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===================================================================
# CONFIGURATION D'AXON FRAMEWORK (v4.9.3)
# ===================================================================
# --- Connexion à Axon Server ---

# Active l'auto-configuration pour Axon Server (recommandé)
axon.axonserver.enabled=true

# Adresse et port de votre instance Axon Server.
# Par défaut, Axon Server tourne sur localhost:8124. Changez si votre Axon Server est ailleurs.
axon.axonserver.servers=localhost:8124

# --- Identification du service ---

# Nom du contexte (ou "Bounded Context") dans Axon Server.
# Tous les services liés au même contexte métier devraient avoir le même nom ici.
# Cela permet à Axon Server de router correctement les messages.
axon.axonserver.context=default

# Nom du composant (ou nom du client). C'est l'identifiant unique de CETTE application
# au sein du contexte. C'est très utile pour le débogage dans l'interface d'Axon Server.
# Il est recommandé de le rendre identique au spring.application.name.
axon.axonserver.component-name=${spring.application.name}

# --- Configuration des processeurs d'événements ---

# Par défaut, Axon crée des processeurs d'événements "subscribing" pour les Sagas,
# ce qui est généralement suffisant. Cependant, pour plus de robustesse, on peut forcer
# l'utilisation de processeurs "tracking".
# Un "Tracking Event Processor" est plus résilient : il peut reprendre le traitement
# des événements après un crash et peut être rejoué.
# Ici, on configure le groupe de processeurs pour nos Sagas ('SoldeContratSaga')
# pour qu'il soit de type "tracking".
axon.eventhandling.processors.SoldeContratSaga.source=axonServerEventStore
axon.eventhandling.processors.SoldeContratSaga.mode=tracking

# --- Configuration de la sérialisation ---

# Axon utilise par défaut le sérialiseur XStream, qui est flexible mais peut être verbeux.
# Pour la production, il est fortement recommandé de passer à Jackson pour la sérialisation en JSON.
# Cela rend les événements lisibles dans l'Event Store et interopérables.

# Sérialiseur par défaut pour les messages (commandes, requêtes)
axon.serializer.messages=jackson
# Sérialiseur pour les événements (le plus important)
axon.serializer.events=jackson
# Sérialiseur général
axon.serializer.general=jackson

# Configuration de Jackson pour inclure des informations de type,
# ce qui est nécessaire pour la désérialisation polymorphique.
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.default-property-inclusion=non_null


# ===================================================================
# CONFIGURATION SWAGGER / OPENAPI (springdoc-openapi)
# ===================================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


