spring.application.name=locataire-rest-api
server.port=8182
# Configuration de la base de données PostgreSQL pour Locatairedb
spring.datasource.url=jdbc:postgresql://localhost:5432/locatairedb
spring.datasource.username=ddrissa
spring.datasource.password=dddd
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Configuration du serveur Axon
axon.axonserver.servers=localhost:8124
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
