spring.application.name=raiting-service
server.port=8183
# Configuration de la base de données PostgreSQL pour Notationdb
spring.datasource.url=jdbc:postgresql://localhost:5432/notationdb
spring.datasource.username=ddrissa
spring.datasource.password=dddd
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Configuration du serveur Axon
axon.axonserver.servers=localhost:8124
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs